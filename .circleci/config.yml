version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install uv
          command: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run:
          name: Install dependencies
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv sync --all-packages
      - run:
          name: Run ruff
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run ruff check .
      - run:
          name: Run mypy
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run mypy .
      - run:
          name: Run tests with coverage
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run pytest --junitxml=test-results/junit.xml --cov=components --cov-report=html --cov-report=xml
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: htmlcov
          destination: coverage-report
      - store_artifacts:
          path: coverage.xml

  deploy:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Trigger Render deploy
          command: |
            if [ -z "${RENDER_API_KEY}" ] || [ -z "${RENDER_SERVICE_ID}" ]; then
              echo "Skipping deploy: RENDER_API_KEY or RENDER_SERVICE_ID not set"
              exit 0
            fi
            HTTP_CODE=$(curl -s -o /tmp/render_resp.txt -w "%{http_code}" \
              --request POST \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data '{"clearCache":"do_not_clear"}')
            echo "Render API response (HTTP ${HTTP_CODE}):"
            cat /tmp/render_resp.txt
            echo ""
            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "Deploy failed with HTTP ${HTTP_CODE}"
              exit 1
            fi

workflows:
  main:
    jobs:
      - test
      - deploy:
          requires:
            - test
          filters:
            branches:
              only:
                - main
                - feat/hw3
